name: Retag GHCR Image

on:
  push:
    branches:
      - next/retag-v4.2.1-page-monitor-groups.1

permissions:
  contents: read
  packages: write

env:
  SOURCE_TAG: nightly
  TARGET_TAG: v4.2.1-page-monitor-groups.1

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Copy image manifest tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [[ "$TARGET_TAG" == nightly* ]]; then
            echo "Target tag must not be a nightly tag"
            exit 1
          fi

          docker buildx imagetools create --tag "$image:$TARGET_TAG" "$image:$SOURCE_TAG"
          docker buildx imagetools create --tag "$image:$TARGET_TAG-alpine" "$image:$SOURCE_TAG-alpine"

          docker buildx imagetools inspect "$image:$TARGET_TAG"
          docker buildx imagetools inspect "$image:$TARGET_TAG-alpine"
